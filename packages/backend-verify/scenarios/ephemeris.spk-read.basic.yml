name: ephemeris.spk-read.basic
setup:
  kernels:
    - $FIXTURES/basic-time
    - $FIXTURES/ephemeris-de440s
compare:
  tolAbs: 1e-12
  tolRel: 1e-12
cases:
  - id: ephemeris.spkezr.earth-sun
    call: ephemeris.spkezr
    args:
      - EARTH
      - 0
      - J2000
      - NONE
      - SUN

  - id: ephemeris.spkpos.earth-sun
    call: ephemeris.spkpos
    args:
      - EARTH
      - 0
      - J2000
      - NONE
      - SUN

  - id: ephemeris.spkez.earth-sun
    call: ephemeris.spkez
    args:
      - 399
      - 0
      - J2000
      - NONE
      - 10

  - id: ephemeris.spkezp.earth-sun
    call: ephemeris.spkezp
    args:
      - 399
      - 0
      - J2000
      - NONE
      - 10

  - id: ephemeris.spkgeo.earth-sun
    call: ephemeris.spkgeo
    args:
      - 399
      - 0
      - J2000
      - 10

  - id: ephemeris.spkgps.earth-sun
    call: ephemeris.spkgps
    args:
      - 399
      - 0
      - J2000
      - 10

  - id: ephemeris.spkssb.earth
    call: ephemeris.spkssb
    args:
      - 399
      - 0
      - J2000

  - id: ephemeris.spkpds.simple
    call: ephemeris.spkpds
    args:
      - 399
      - 10
      - J2000
      - 2
      - -1
      - 1

  - id: ephemeris.spksfs.earth
    call: ephemeris.spksfs
    args:
      - 399
      - 0
