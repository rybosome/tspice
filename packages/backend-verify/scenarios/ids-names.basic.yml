name: ids-names.basic
setup:
  kernels:
    - $FIXTURES/frames-minimal
    - $FIXTURES/body399-char-foo.tpc
cases:
  - id: bodn2c-earth
    call: ids-names.bodn2c
    args:
      - "EARTH"

  - id: bodn2c-earth-lower
    call: ids-names.bodn2c
    args:
      - "earth"

  - id: bodn2c-unknown
    call: ids-names.bodn2c
    args:
      - "NOT_A_BODY"

  - id: bodc2n-earth
    call: ids-names.bodc2n
    args:
      - 399

  - id: bodc2n-moon
    call: ids-names.bodc2n
    args:
      - 301

  - id: bodc2n-unknown
    call: ids-names.bodc2n
    args:
      - 123456789

  - id: bodc2s-earth
    call: ids-names.bodc2s
    args:
      - 399

  - id: bods2c-earth
    call: ids-names.bods2c
    args:
      - "EARTH"

  - id: bods2c-earth-code-string
    call: ids-names.bods2c
    args:
      - "399"

  - id: bods2c-unknown
    call: ids-names.bods2c
    args:
      - "NOT_A_BODY"

  - id: boddef-test-body
    call: ids-names.boddef
    args:
      - "TSPICE_TEST_BODY"
      - 123456789

  - id: bodfnd-radii
    call: ids-names.bodfnd
    args:
      - 399
      - "RADII"

  - id: bodfnd-radii-normalized
    call: ids-names.bodfnd
    args:
      - 399
      - "  radii  "

  - id: bodfnd-char-typed-item
    call: ids-names.bodfnd
    args:
      - 399
      - "FOO"

  - id: bodvar-radii
    call: ids-names.bodvar
    args:
      - 399
      - "RADII"

  - id: bodvar-char-typed-item
    call: ids-names.bodvar
    args:
      - 399
      - "FOO"
