id: methods/time/str2et@v1
kind: method
contractMethod: time.str2et
canonicalMethod: time.str2et
uses:
  - workflows/legacy/time.str2et.basic@v1
cases:
  - id: invalid
    args:
      - not a time
    compare:
      errorShort: true
    expect:
      ok: false
  - id: iso-utc
    args:
      - 2010-01-02T03:04:05
    expect:
      ok: true
  - id: j2000-tdb
    args:
      - 2000 JAN 01 12:00:00 TDB
    expect:
      ok: true
