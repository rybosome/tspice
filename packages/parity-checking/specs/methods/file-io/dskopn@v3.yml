schemaVersion: 3
manifest:
  id: methods/file-io/dskopn@v3
  kind: method
contract:
  contractMethod: file-io.dskopn
  canonicalMethod: file-io.dskopn
  result:
    type: object
    required:
      - opened
    properties:
      opened:
        const: true
workflow:
  steps:
    - op: withResource
      as: dskPath
      acquire:
        op: materialize
        fixture: minimalDsk
        as: dskPath
      steps:
        - op: projectResult
          out:
            opened: true
      finally:
        - op: unlink
          target: $refs.dskPath
cases:
  - id: open-close-temp-dsk
    expect:
      ok: true
