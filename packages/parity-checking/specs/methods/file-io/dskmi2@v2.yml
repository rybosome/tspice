schemaVersion: 2
manifest:
  id: methods/file-io/dskmi2@v2
  kind: method
contract:
  contractMethod: file-io.dskmi2
  canonicalMethod: file-io.dskmi2
  aliases: []
  result:
    type: object
    required: [computedSpatialIndex]
    properties:
      computedSpatialIndex: { const: true }
workflow:
  steps:
    - op: spiceCall
      call: dskmi2_c
      in:
        - 3
        - [0, 0, 0, 1, 0, 0, 0, 1, 0]
        - 1
        - [1, 2, 3]
        - 0.2
        - 5
        - 2048
        - 512
        - 1024
        - true
        - 8192
      out:
        spaixd: spaixd
        spaixi: spaixi
        spaixdLength: spaixdLength
        spaixiLength: spaixiLength
    - op: assert
      test: { gt: [$refs.spaixdLength, 0] }
      error:
        code: assert_dskmi2_spaixd_non_empty
        message: dskmi2 expected non-empty spaixd
    - op: assert
      test: { gt: [$refs.spaixiLength, 0] }
      error:
        code: assert_dskmi2_spaixi_non_empty
        message: dskmi2 expected non-empty spaixi
    - op: projectResult
      out:
        computedSpatialIndex: true
cases:
  - id: minimal-triangle-index
    expect:
      ok: true
