schemaVersion: 3
manifest:
  id: methods/file-io/exists@v3
  kind: method
contract:
  contractMethod: file-io.exists
  canonicalMethod: file-io.exists
  errors:
    - code: invalid_args
workflow:
  steps:
    - op: call
      call: self
      in:
        - $args.0
cases:
  - id: file-io.exists.present-file
    args:
      - $FIXTURES/de440s/de440s.bsp
    expect:
      ok: true
  - id: file-io.exists.missing-file
    args:
      - $FIXTURES/de440s/does-not-exist.bsp
    expect:
      ok: true
  - id: file-io.exists.rejects-non-string-path
    compare:
      errorShort: true
    args:
      - 42
    expect:
      ok: false
