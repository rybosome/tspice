schemaVersion: 2
manifest:
  id: methods/file-io/dskopn@v2
  kind: method
contract:
  contractMethod: file-io.dskopn
  canonicalMethod: file-io.dskopn
  aliases: []
  result:
    type: object
    required: [opened]
    properties:
      opened: { const: true }
workflow:
  steps:
    - op: materialize
      fixture: minimalDsk
      as: dskPath
    - op: dasOpen
      path: $refs.dskPath
      as: dasHandle
    - op: dasClose
      target: $refs.dasHandle
    - op: projectResult
      out:
        opened: true
  cleanup:
    - op: unlink
      target: $refs.dskPath
cases:
  - id: open-close-temp-dsk
    expect:
      ok: true
