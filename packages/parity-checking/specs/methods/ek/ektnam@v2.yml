schemaVersion: 2
manifest:
  id: method.ek.ektnam@v2
  kind: method
contract:
  contractMethod: ek.ektnam
  canonicalMethod: ek.ektnam
  aliases: []
  args:
    - name: index
      type: spiceInt
      constraints: { min: 0 }
  result:
    type: object
    required: [ok, name]
    properties:
      ok: { const: true }
      name: { const: CASSINI_NOISE_EVENTS }
setup:
  kernels:
    - ../../../backend-node/test/fixtures/ek-fixture.bes
workflow:
  steps:
    - op: spiceCall
      call: ektnam_c
      in: [$args.index]
      as: name

    - op: projectResult
      out:
        ok: true
        name: $refs.name
cases:
  - id: reads-table-name-at-index-zero
    args:
      index: 0
    expect:
      ok: true
