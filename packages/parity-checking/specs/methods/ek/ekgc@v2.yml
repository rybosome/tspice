schemaVersion: 2
manifest:
  id: method.ek.ekgc@v2
  kind: method
contract:
  contractMethod: ek.ekgc
  canonicalMethod: ek.ekgc
  aliases: []
  args:
    - name: query
      type: string
    - name: selidx
      type: spiceInt
      constraints: { min: 0 }
    - name: row
      type: spiceInt
      constraints: { min: 0 }
    - name: elment
      type: spiceInt
      constraints: { min: 0 }
  result:
    type: object
    required: [found, isNull, value]
    properties:
      found: { const: true }
      isNull: { const: false }
      value: { const: ISS_WAC_ShutterBladeBMove }
setup:
  kernels:
    - ../../../backend-node/test/fixtures/ek-fixture.bes
workflow:
  steps:
    - op: spiceCall
      call: ekgc_c
      in: [$args.query, $args.selidx, $args.row, $args.elment]
      as: read

    - op: projectResult
      out:
        found: $refs.read.found
        isNull: $refs.read.isNull
        value: $refs.read.value
cases:
  - id: reads-event-string
    args:
      query: "SELECT EVENT FROM CASSINI_NOISE_EVENTS WHERE EVENT = 'ISS_WAC_ShutterBladeBMove'"
      selidx: 0
      row: 0
      elment: 0
    expect:
      ok: true
