schemaVersion: 2
manifest:
  id: method.ek.eknseg@v2
  kind: method
contract:
  contractMethod: ek.eknseg
  canonicalMethod: ek.eknseg
  aliases: []
  result:
    type: object
    required: [ok, nseg]
    properties:
      ok: { const: true }
      nseg: { const: 1, type: spiceInt }
setup:
  kernels:
    - ../../../backend-node/test/fixtures/ek-fixture.bes
workflow:
  steps:
    - op: resolveFirstLoadedEkPath
      as: ekPath

    - op: spiceCall
      call: ekopr_c
      in: [$refs.ekPath]
      as: handle

    - op: spiceCall
      call: eknseg_c
      in: [$refs.handle]
      as: nseg

    - op: projectResult
      out:
        ok: true
        nseg: $refs.nseg
  cleanup:
    - op: spiceCall
      call: ekcls_c
      in: [$refs.handle]
cases:
  - id: reads-segment-count
    args: {}
    expect:
      ok: true
