schemaVersion: 2
manifest:
  id: method.ek.ekgi@v2
  kind: method
contract:
  contractMethod: ek.ekgi
  canonicalMethod: ek.ekgi
  aliases: []
  args:
    - name: query
      type: string
    - name: selidx
      type: spiceInt
      constraints: { min: 0 }
    - name: row
      type: spiceInt
      constraints: { min: 0 }
    - name: elment
      type: spiceInt
      constraints: { min: 0 }
  result:
    type: object
    required: [found, isNull, value]
    properties:
      found: { const: true }
      isNull: { const: false }
      value: { type: spiceInt }
setup:
  kernels:
    - ../../../backend-node/test/fixtures/ek-fixture.bes
workflow:
  steps:
    - op: spiceCall
      call: ekgi_c
      in: [$args.query, $args.selidx, $args.row, $args.elment]
      as: read

    - op: projectResult
      out:
        found: $refs.read.found
        isNull: $refs.read.isNull
        value: $refs.read.value
cases:
  - id: fails-on-double-column
    args:
      query: "SELECT COMMAND_EXEC_TIME FROM CASSINI_NOISE_EVENTS WHERE EVENT = 'ISS_WAC_ShutterBladeBMove'"
      selidx: 0
      row: 0
      elment: 0
    compare:
      errorShort: true
    expect:
      ok: false
      errorShort: SPICE(INVALIDTYPE)
