schemaVersion: 2
manifest:
  id: method.ek.ekgd@v2
  kind: method
contract:
  contractMethod: ek.ekgd
  canonicalMethod: ek.ekgd
  aliases: []
  args:
    - name: query
      type: string
    - name: selidx
      type: spiceInt
      constraints: { min: 0 }
    - name: row
      type: spiceInt
      constraints: { min: 0 }
    - name: elment
      type: spiceInt
      constraints: { min: 0 }
  result:
    type: object
    required: [ok, found, isNull, value]
    properties:
      ok: { const: true }
      found: { const: true }
      isNull: { const: false }
      value: { const: 58202426.04357445 }
setup:
  kernels:
    - ../../../backend-node/test/fixtures/ek-fixture.bes
workflow:
  steps:
    - op: spiceCall
      call: ekgd_c
      in: [$args.query, $args.selidx, $args.row, $args.elment]
      as: read

    - op: projectResult
      out:
        ok: true
        found: $refs.read.found
        isNull: $refs.read.isNull
        value: $refs.read.value
cases:
  - id: reads-command-exec-time
    args:
      query: "SELECT COMMAND_EXEC_TIME FROM CASSINI_NOISE_EVENTS WHERE EVENT = 'ISS_WAC_ShutterBladeBMove'"
      selidx: 0
      row: 0
      elment: 0
    expect:
      ok: true
