schemaVersion: 2
manifest:
  id: method.ek.ekopw@v2
  kind: method
contract:
  contractMethod: ek.ekopw
  canonicalMethod: ek.ekopw
  aliases: []
  args:
    - name: tag
      type: string
    - name: ifname
      type: string
    - name: ncomch
      type: spiceInt
      constraints: { min: 0 }
  result:
    type: object
    required: [ok, handle]
    properties:
      ok: { const: true }
      handle: { type: spiceInt }
setup:
  kernels:
    - ../../../backend-node/test/fixtures/ek-fixture.bes
workflow:
  steps:
    - op: spiceCall
      call: ekopw_c
      in: [$args.tag, $args.ifname, $args.ncomch]
      as: handle

    - op: projectResult
      out:
        ok: true
        handle: $refs.handle
cases:
  - id: opens-existing-ek-for-write
    args:
      tag: ek-open-write
      ifname: TSPICE
      ncomch: 0
    expect:
      ok: true
