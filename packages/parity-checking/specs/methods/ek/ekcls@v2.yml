schemaVersion: 2
manifest:
  id: method.ek.ekcls@v2
  kind: method
contract:
  contractMethod: ek.ekcls
  canonicalMethod: ek.ekcls
  aliases: []
  args:
    - name: tag
      type: string
    - name: ifname
      type: string
    - name: ncomch
      type: spiceInt
      constraints: { min: 0 }
  result:
    type: object
    required: [ok, closed]
    properties:
      ok: { const: true }
      closed: { const: true }
setup:
  kernels:
    - ../../../backend-node/test/fixtures/ek-fixture.bes
workflow:
  steps:
    - op: spiceCall
      call: ekcls_c
      in: [$args.tag, $args.ifname, $args.ncomch]

    - op: projectResult
      out:
        ok: true
        closed: true
cases:
  - id: closes-new-handle
    args:
      tag: ek-close
      ifname: TSPICE
      ncomch: 0
    expect:
      ok: true
