schemaVersion: 3
manifest:
  id: methods/cells-windows/size@v3
  kind: method
contract:
  contractMethod: cells-windows.size
  canonicalMethod: cells-windows.size
  args:
    - name: size
      type: spiceInt
  result:
    type: object
    required:
      - size
    properties:
      size:
        type: spiceInt
  errors:
    - code: invalid_args
    - code: spice_error
workflow:
  steps:
    - op: call
      fn: cells-windows.size
      in: $args
cases:
  - id: basic
    args:
      size: 8
    expect:
      ok: true
  - id: rejects-negative-size
    args:
      size: -1
    expect:
      ok: false
      errorCode: invalid_args
