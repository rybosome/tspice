schemaVersion: 3
manifest:
  id: methods/cells-windows/size@v3
  kind: method
contract:
  contractMethod: cells-windows.size
  canonicalMethod: cells-windows.size
  aliases: []
  args:
    - name: size
      type: spiceInt
  result:
    type: object
    required:
      - size
    properties:
      size:
        type: spiceInt
  errors:
    - code: invalid_args
    - code: spice_error
workflow:
  steps:
    - op: allocCell
      as: cell
      params:
        kind: int
        size: $args.size
    - op: call
      in:
        - $refs.cell
      as: size
      fn: cells-windows.size
    - op: projectResult
      out:
        size: $refs.size
  cleanup:
    - op: freeCell
      target: $refs.cell
cases:
  - id: basic
    args:
      size: 8
    expect:
      ok: true
  - id: rejects-negative-size
    args:
      size: -1
    expect:
      ok: false
      errorCode: invalid_args
