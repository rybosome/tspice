schemaVersion: 3
manifest:
  id: methods/cells-windows/wninsd@v3
  kind: method
contract:
  contractMethod: cells-windows.wninsd
  canonicalMethod: cells-windows.wninsd
  result:
    type: object
    required:
      - card
      - first
    properties:
      card:
        type: spiceInt
        const: 1
  errors:
    - code: invalid_args
    - code: spice_error
workflow:
  steps:
    - op: call
      call: self
      in:
        - $args.0
        - $args.1
        - $args.2
cases:
  - id: cells-windows.wninsd.basic
    args:
      - 0.5
      - 2.5
      - - window
        - 4
    expect:
      ok: true
  - id: cells-windows.wninsd.rejects-negative-max-intervals
    args:
      - 0.5
      - 2.5
      - - window
        - -1
    expect:
      ok: false
      errorCode: invalid_args
  - id: cells-windows.wninsd.rejects-non-numeric-left-endpoint
    args:
      - bad
      - 2.5
      - - window
        - 4
    expect:
      ok: false
      errorCode: invalid_args
  - id: cells-windows.wninsd.rejects-wrong-recipe-kind
    args:
      - 0.5
      - 2.5
      - - double
        - 8
    expect:
      ok: false
      errorCode: invalid_args
