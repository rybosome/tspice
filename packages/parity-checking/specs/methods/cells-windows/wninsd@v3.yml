schemaVersion: 3
manifest:
  id: methods/cells-windows/wninsd@v3
  kind: method
contract:
  contractMethod: cells-windows.wninsd
  canonicalMethod: cells-windows.wninsd
  result:
    type: object
    required:
      - card
    properties:
      card:
        type: spiceInt
        const: 2
  errors:
    - code: invalid_args
    - code: spice_error
workflow:
  steps:
    - op: allocWindow
      as: window
      params:
        maxIntervals: 4
    - op: call
      call: self
      in:
        - 0.5
        - 2.5
        - $refs.window
    - op: call
      call: cells-windows.card
      in:
        - $refs.window
      as: card
    - op: projectResult
      out:
        card: $refs.card
  cleanup:
    - op: freeWindow
      target: $refs.window
cases:
  - id: cells-windows.wninsd.basic
    args: {}
    expect:
      ok: true
