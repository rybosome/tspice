schemaVersion: 3
manifest:
  id: methods/cells-windows/insrti@v3
  kind: method
contract:
  contractMethod: cells-windows.insrti
  canonicalMethod: cells-windows.insrti
  result:
    type: object
    required:
      - card
    properties:
      card:
        type: spiceInt
        const: 1
workflow:
  steps:
    - op: allocCell
      as: cell
      params:
        kind: int
        size: 8
    - op: call
      call: self
      in:
        - 2
        - $refs.cell
    - op: call
      call: cells-windows.card
      in:
        - $refs.cell
      as: card
    - op: projectResult
      out:
        card: $refs.card
  cleanup:
    - op: freeCell
      target: $refs.cell
cases:
  - id: cells-windows.insrti.basic
    args: {}
    expect:
      ok: true
