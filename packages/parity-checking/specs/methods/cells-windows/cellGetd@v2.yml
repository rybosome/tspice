schemaVersion: 2
manifest:
  id: methods/cells-windows/cellGetd@v2
  kind: method
contract:
  contractMethod: cells-windows.cellGetd
  canonicalMethod: cells-windows.cellGetd
  aliases: []
  result:
    const: 3.25
  errors:
    - code: invalid_args
    - code: spice_error
workflow:
  steps:
    - op: invokeLegacyCall
cases:
  - id: cells-windows.cellGetd.basic
    args:
      - - double
        - 8
      - 1
    expect:
      ok: true

  - id: cells-windows.cellGetd.rejects-negative-size
    args:
      - - double
        - -1
      - 0
    expect:
      ok: false
      errorCode: invalid_args

  - id: cells-windows.cellGetd.rejects-wrong-recipe-kind
    args:
      - - int
        - 8
      - 0
    expect:
      ok: false
      errorCode: invalid_args

  - id: cells-windows.cellGetd.rejects-non-integer-index
    args:
      - - double
        - 8
      - 0.5
    expect:
      ok: false
      errorCode: invalid_args
