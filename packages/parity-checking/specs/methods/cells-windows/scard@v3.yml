schemaVersion: 3
manifest:
  id: methods/cells-windows/scard@v3
  kind: method
contract:
  contractMethod: cells-windows.scard
  canonicalMethod: cells-windows.scard
  args:
    - name: size
      type: spiceInt
      constraints:
        min: 0
    - name: card
      type: spiceInt
      constraints:
        min: 0
  result:
    type: object
    required:
      - size
      - card
      - windowSize
      - windowCard
    properties:
      size:
        type: spiceInt
      card:
        type: spiceInt
      windowSize:
        type: spiceInt
      windowCard:
        type: spiceInt
  errors:
    - code: invalid_args
    - code: spice_error
workflow:
  steps:
    - op: call
      fn: cells-windows.scard
      in: $args
cases:
  - id: basic
    args:
      size: 8
      card: 2
    expect:
      ok: true
  - id: rejects-negative-card
    args:
      size: 8
      card: -1
    expect:
      ok: false
      errorCode: invalid_args
