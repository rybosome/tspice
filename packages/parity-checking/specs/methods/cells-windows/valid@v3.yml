schemaVersion: 3
manifest:
  id: methods/cells-windows/valid@v3
  kind: method
contract:
  contractMethod: cells-windows.valid
  canonicalMethod: cells-windows.valid
  args:
    - name: allocSize
      type: spiceInt
      constraints:
        min: 0
    - name: size
      type: spiceInt
      constraints:
        min: 0
    - name: n
      type: spiceInt
      constraints:
        min: 0
  result:
    type: object
    required:
      - size
      - card
      - windowSize
      - windowCard
    properties:
      size:
        type: spiceInt
      card:
        type: spiceInt
      windowSize:
        type: spiceInt
      windowCard:
        type: spiceInt
  errors:
    - code: invalid_args
    - code: spice_error
workflow:
  steps:
    - op: allocCell
      as: cell
      params:
        kind: int
        size: $args.allocSize
    - op: allocWindow
      as: window
      params:
        maxIntervals: 4
    - op: spiceCall
      call: valid_c
      in:
        - $args.size
        - $args.n
        - $refs.cell
    - op: spiceCall
      call: valid_c
      in:
        - $args.size
        - $args.n
        - $refs.window
    - op: spiceCall
      call: size_c
      in:
        - $refs.cell
      as: size
    - op: spiceCall
      call: card_c
      in:
        - $refs.cell
      as: card
    - op: spiceCall
      call: size_c
      in:
        - $refs.window
      as: windowSize
    - op: spiceCall
      call: card_c
      in:
        - $refs.window
      as: windowCard
    - op: projectResult
      out:
        size: $refs.size
        card: $refs.card
        windowSize: $refs.windowSize
        windowCard: $refs.windowCard
  cleanup:
    - op: freeWindow
      target: $refs.window
    - op: freeCell
      target: $refs.cell
cases:
  - id: basic
    args:
      allocSize: 8
      size: 8
      n: 0
    expect:
      ok: true
  - id: rejects-negative-n
    args:
      allocSize: 8
      size: 8
      n: -1
    expect:
      ok: false
      errorCode: invalid_args
