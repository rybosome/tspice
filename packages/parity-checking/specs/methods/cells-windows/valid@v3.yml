schemaVersion: 3
manifest:
  id: methods/cells-windows/valid@v3
  kind: method
contract:
  contractMethod: cells-windows.valid
  canonicalMethod: cells-windows.valid
  args:
    - name: allocSize
      type: spiceInt
      constraints:
        min: 0
    - name: size
      type: spiceInt
      constraints:
        min: 0
    - name: n
      type: spiceInt
      constraints:
        min: 0
  result:
    type: object
    required:
      - size
      - card
      - windowSize
      - windowCard
    properties:
      size:
        type: spiceInt
      card:
        type: spiceInt
      windowSize:
        type: spiceInt
      windowCard:
        type: spiceInt
  errors:
    - code: invalid_args
    - code: spice_error
workflow:
  steps:
    - op: call
      fn: cells-windows.valid
      in: $args
cases:
  - id: basic
    args:
      allocSize: 8
      size: 8
      n: 0
    expect:
      ok: true
  - id: rejects-negative-n
    args:
      allocSize: 8
      size: 8
      n: -1
    expect:
      ok: false
      errorCode: invalid_args
