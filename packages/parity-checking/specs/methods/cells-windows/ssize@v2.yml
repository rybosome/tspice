schemaVersion: 2

manifest:
  id: methods/cells-windows/ssize@v2
  kind: method

contract:
  contractMethod: cells-windows.ssize
  canonicalMethod: cells-windows.ssize
  aliases: []
  args:
    - name: allocSize
      type: spiceInt
      constraints: { min: 0 }
    - name: newSize
      type: spiceInt
      constraints: { min: 0 }
  result:
    type: object
    required: [size, card, windowSize, windowCard]
    properties:
      size: { type: spiceInt }
      card: { type: spiceInt }
      windowSize: { type: spiceInt }
      windowCard: { type: spiceInt }
  errors:
    - code: invalid_args
    - code: spice_error

workflow:
  steps:
    - op: allocCell
      as: cell
      params:
        kind: int
        size: $args.allocSize

    - op: allocWindow
      as: window
      params:
        maxIntervals: 4

    - op: spiceCall
      call: ssize_c
      in: [$args.newSize, $refs.cell]

    - op: spiceCall
      call: ssize_c
      in: [$args.newSize, $refs.window]

    - op: spiceCall
      call: size_c
      in: [$refs.cell]
      as: size

    - op: spiceCall
      call: card_c
      in: [$refs.cell]
      as: card

    - op: spiceCall
      call: size_c
      in: [$refs.window]
      as: windowSize

    - op: spiceCall
      call: card_c
      in: [$refs.window]
      as: windowCard

    - op: projectResult
      out:
        size: $refs.size
        card: $refs.card
        windowSize: $refs.windowSize
        windowCard: $refs.windowCard

  cleanup:
    - op: freeWindow
      target: $refs.window

    - op: freeCell
      target: $refs.cell

cases:
  - id: basic
    args: { allocSize: 8, newSize: 6 }
    expect:
      ok: true

  - id: rejects-negative-size
    args: { allocSize: 8, newSize: -1 }
    expect:
      ok: false
      errorCode: invalid_args
