schemaVersion: 3
manifest:
  id: methods/cells-windows/wnfetd@v3
  kind: method
contract:
  contractMethod: cells-windows.wnfetd
  canonicalMethod: cells-windows.wnfetd
  result:
    const:
      - 0
      - 3
  errors:
    - code: invalid_args
    - code: spice_error
workflow:
  steps:
    - op: call
      fn: cells-windows.wnfetd
      in: $args
cases:
  - id: cells-windows.wnfetd.basic
    args:
      - - window
        - 4
      - 0
    expect:
      ok: true
  - id: cells-windows.wnfetd.rejects-negative-max-intervals
    args:
      - - window
        - -1
      - 0
    expect:
      ok: false
      errorCode: invalid_args
  - id: cells-windows.wnfetd.rejects-wrong-recipe-kind
    args:
      - - double
        - 8
      - 0
    expect:
      ok: false
      errorCode: invalid_args
  - id: cells-windows.wnfetd.rejects-non-integer-index
    args:
      - - window
        - 4
      - 0.5
    expect:
      ok: false
      errorCode: invalid_args
