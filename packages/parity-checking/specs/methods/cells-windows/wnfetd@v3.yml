schemaVersion: 3
manifest:
  id: methods/cells-windows/wnfetd@v3
  kind: method
contract:
  contractMethod: cells-windows.wnfetd
  canonicalMethod: cells-windows.wnfetd
  result:
    const:
      - 0
      - 3
  errors:
    - code: invalid_args
    - code: spice_error
workflow:
  steps:
    - op: allocWindow
      as: window
      params:
        maxIntervals: 4
    - op: call
      fn: cells-windows.wninsd
      in:
        - 0
        - 3
        - $refs.window
    - op: call
      fn: cells-windows.wnfetd
      in:
        - $refs.window
        - 0
  cleanup:
    - op: freeWindow
      target: $refs.window
cases:
  - id: cells-windows.wnfetd.basic
    args: {}
    expect:
      ok: true
