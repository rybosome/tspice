schemaVersion: 3
manifest:
  id: methods/cells-windows/ssize@v3
  kind: method
contract:
  contractMethod: cells-windows.ssize
  canonicalMethod: cells-windows.ssize
  args:
    - name: allocSize
      type: spiceInt
      constraints:
        min: 0
    - name: newSize
      type: spiceInt
      constraints:
        min: 0
  result:
    type: object
    required:
      - size
      - card
      - windowSize
      - windowCard
    properties:
      size:
        type: spiceInt
      card:
        type: spiceInt
      windowSize:
        type: spiceInt
      windowCard:
        type: spiceInt
  errors:
    - code: invalid_args
    - code: spice_error
workflow:
  steps:
    - op: call
      fn: cells-windows.ssize
      in: $args
cases:
  - id: basic
    args:
      allocSize: 8
      newSize: 6
    expect:
      ok: true
  - id: rejects-negative-size
    args:
      allocSize: 8
      newSize: -1
    expect:
      ok: false
      errorCode: invalid_args
