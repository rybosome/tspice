schemaVersion: 3
manifest:
  id: methods/cells-windows/wnvald@v3
  kind: method
contract:
  contractMethod: cells-windows.wnvald
  canonicalMethod: cells-windows.wnvald
  result:
    type: object
    required:
      - card
      - size
    properties:
      card:
        type: spiceInt
        const: 0
      size:
        type: spiceInt
        const: 8
  errors:
    - code: invalid_args
    - code: spice_error
workflow:
  steps:
    - op: allocWindow
      as: window
      params:
        maxIntervals: 4
    - op: call
      fn: cells-windows.wnvald
      in:
        - 8
        - 0
        - $refs.window
    - op: call
      fn: cells-windows.card
      in:
        - $refs.window
      as: card
    - op: call
      fn: cells-windows.size
      in:
        - $refs.window
      as: size
    - op: projectResult
      out:
        card: $refs.card
        size: $refs.size
  cleanup:
    - op: freeWindow
      target: $refs.window
cases:
  - id: cells-windows.wnvald.basic
    args: {}
    expect:
      ok: true
