schemaVersion: 3
manifest:
  id: methods/cells-windows/card@v3
  kind: method
contract:
  contractMethod: cells-windows.card
  canonicalMethod: cells-windows.card
  args:
    - name: size
      type: spiceInt
  result:
    type: object
    required:
      - card
    properties:
      card:
        type: spiceInt
  errors:
    - code: invalid_args
    - code: spice_error
workflow:
  steps:
    - op: call
      fn: cells-windows.card
      in: $args
cases:
  - id: basic
    args:
      size: 8
    expect:
      ok: true
  - id: rejects-negative-size
    args:
      size: -1
    expect:
      ok: false
      errorCode: invalid_args
