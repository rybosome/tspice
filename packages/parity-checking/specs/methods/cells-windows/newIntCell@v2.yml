schemaVersion: 2

manifest:
  id: methods/cells-windows/newIntCell@v2
  kind: method

contract:
  contractMethod: cells-windows.newIntCell
  canonicalMethod: cells-windows.newIntCell
  aliases: []
  args:
    - name: size
      type: spiceInt
  result:
    type: object
    required: [kind, size, card]
    properties:
      kind: { const: int }
      size: { type: spiceInt }
      card: { type: spiceInt }
  errors:
    - code: invalid_args
    - code: spice_error

workflow:
  steps:
    - op: allocCell
      as: cell
      params:
        kind: int
        size: $args.size

    - op: spiceCall
      call: card_c
      in: [$refs.cell]
      as: card

    - op: spiceCall
      call: size_c
      in: [$refs.cell]
      as: size

    - op: projectResult
      out:
        kind: int
        size: $refs.size
        card: $refs.card

  cleanup:
    - op: freeCell
      target: $refs.cell

cases:
  - id: basic
    args: { size: 8 }
    expect:
      ok: true

  - id: rejects-negative-size
    args: { size: -1 }
    expect:
      ok: false
      errorCode: invalid_args
