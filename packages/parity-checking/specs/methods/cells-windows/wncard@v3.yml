schemaVersion: 3
manifest:
  id: methods/cells-windows/wncard@v3
  kind: method
contract:
  contractMethod: cells-windows.wncard
  canonicalMethod: cells-windows.wncard
  aliases: []
  result:
    const: 1
  errors:
    - code: invalid_args
    - code: spice_error
workflow:
  steps:
    - op: callContract
cases:
  - id: cells-windows.wncard.basic
    args:
      - - window
        - 4
    expect:
      ok: true
  - id: cells-windows.wncard.rejects-negative-max-intervals
    args:
      - - window
        - -1
    expect:
      ok: false
      errorCode: invalid_args
  - id: cells-windows.wncard.rejects-wrong-recipe-kind
    args:
      - - double
        - 8
    expect:
      ok: false
      errorCode: invalid_args
