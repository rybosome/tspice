schemaVersion: 3
manifest:
  id: methods/cells-windows/wncard@v3
  kind: method
contract:
  contractMethod: cells-windows.wncard
  canonicalMethod: cells-windows.wncard
  result:
    const: 1
  errors:
    - code: invalid_args
    - code: spice_error
workflow:
  steps:
    - op: allocWindow
      as: window
      params:
        maxIntervals: 4
    - op: call
      fn: cells-windows.wninsd
      in:
        - 0
        - 3
        - $refs.window
    - op: call
      fn: cells-windows.wncard
      in:
        - $refs.window
  cleanup:
    - op: freeWindow
      target: $refs.window
cases:
  - id: cells-windows.wncard.basic
    args: {}
    expect:
      ok: true
