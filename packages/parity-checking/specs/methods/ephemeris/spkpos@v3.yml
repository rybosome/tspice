schemaVersion: 3
manifest:
  id: methods/ephemeris/spkpos@v3
  kind: method
contract:
  contractMethod: ephemeris.spkpos
  canonicalMethod: ephemeris.spkpos
setup:
  kernels:
    - $FIXTURES/basic-time
    - $FIXTURES/ephemeris-de440s
defaults:
  compare:
    tolAbs: 1e-12
    tolRel: 1e-12
workflow:
  steps:
    - op: call
      call: self
      in:
        - $args.0
        - $args.1
        - $args.2
        - $args.3
        - $args.4
cases:
  - id: ephemeris.spkpos.earth-sun
    args:
      - EARTH
      - 0
      - J2000
      - NONE
      - SUN
    expect:
      ok: true
