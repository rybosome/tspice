schemaVersion: 3
manifest:
  id: methods/ephemeris/spkgps@v3
  kind: method
contract:
  contractMethod: ephemeris.spkgps
  canonicalMethod: ephemeris.spkgps
setup:
  kernels:
    - $FIXTURES/basic-time
    - $FIXTURES/ephemeris-de440s
defaults:
  compare:
    tolAbs: 1e-12
    tolRel: 1e-12
workflow:
  steps:
