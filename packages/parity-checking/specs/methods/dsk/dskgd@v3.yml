schemaVersion: 3
manifest:
  id: methods/dsk/dskgd@v3
  kind: method
contract:
  contractMethod: dsk.dskgd
  canonicalMethod: dsk.dskgd
  args:
    - name: selector
      type: spiceInt
      constraints:
        min: 0
        max: 1
  result:
    type: object
    required:
      - selector
      - value
    properties:
      selector:
        type: spiceInt
      value:
        type: spiceInt
workflow:
  steps:
    - op: withResource
      as: dskPath
      acquire:
        op: materialize
        fixture: minimalDsk
        as: dskPath
      steps:
        - op: withResource
          as: dasHandle
          acquire:
            op: dasOpen
            path: $refs.dskPath
            as: dasHandle
          steps:
            - op: withResource
              as: dladsc
              acquire:
                op: dlaBeginForwardSearch
                handle: $refs.dasHandle
                as: dladsc
              steps:
                - op: spiceCall
                  call: dskgd_c
                  in:
                    - $refs.dasHandle
                    - $refs.dladsc
                  as: dskdsc
                - op: project
                  out:
                    surfce: $refs.dskdsc.surfce
                    center: $refs.dskdsc.center
                - op: switch
                  on: $args.selector
                  cases:
                    "0":
                      - op: projectResult
                        out:
                          selector: $args.selector
                          value: $refs.surfce
                    "1":
                      - op: projectResult
                        out:
                          selector: $args.selector
                          value: $refs.center
              finally: []
          finally:
            - op: dasClose
              target: $refs.dasHandle
      finally:
        - op: unlink
          target: $refs.dskPath
cases:
  - id: selector-surfce
    args:
      selector: 0
    expect:
      ok: true
  - id: selector-center
    args:
      selector: 1
    expect:
      ok: true
