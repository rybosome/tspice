schemaVersion: 2
manifest:
  id: methods/dsk/dskb02@v2
  kind: method
contract:
  contractMethod: dsk.dskb02
  canonicalMethod: dsk.dskb02
  args:
    - name: selector
      type: spiceInt
      constraints:
        min: 0
        max: 1
  result:
    type: object
    required: [selector, value]
    properties:
      selector: { type: spiceInt }
      value: { type: spiceInt }
workflow:
  steps:
    - op: materialize
      fixture: minimalDsk
      as: dskPath
    - op: dasOpen
      path: $refs.dskPath
      as: dasHandle
    - op: dlaBeginForwardSearch
      handle: $refs.dasHandle
      as: dladsc
    - op: spiceCall
      call: dskb02_c
      in: [$refs.dasHandle, $refs.dladsc]
      out:
        nv: nv
        np: np
    - op: switch
      on: $args.selector
      cases:
        0:
          - op: projectResult
            out:
              selector: $args.selector
              value: $refs.nv
        1:
          - op: projectResult
            out:
              selector: $args.selector
              value: $refs.np
  cleanup:
    - op: dasClose
      target: $refs.dasHandle
    - op: unlink
      target: $refs.dskPath
cases:
  - id: selector-nv
    args: { selector: 0 }
    expect: { ok: true }
  - id: selector-np
    args: { selector: 1 }
    expect: { ok: true }
