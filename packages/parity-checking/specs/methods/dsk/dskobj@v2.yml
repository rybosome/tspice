schemaVersion: 2
manifest:
  id: methods/dsk/dskobj@v2
  kind: method
contract:
  contractMethod: dsk.dskobj
  canonicalMethod: dsk.dskobj
  args: []
  result:
    type: object
    required: [hasBodies]
    properties:
      hasBodies: { const: true }
workflow:
  steps:
    - op: materialize
      fixture: minimalDsk
      as: dskPath
    - op: allocCell
      as: bodyIds
      params:
        kind: int
        size: 100
    - op: spiceCall
      call: dskobj_c
      in: [$refs.dskPath, $refs.bodyIds]
    - op: spiceCall
      call: card_c
      in: [$refs.bodyIds]
      as: bodyCount
    - op: assert
      test:
        gt: [$refs.bodyCount, 0]
      error:
        code: assert_dskobj_has_bodies
        message: dskobj expected at least one body id
    - op: projectResult
      out:
        hasBodies: true
  cleanup:
    - op: freeCell
      target: $refs.bodyIds
    - op: unlink
      target: $refs.dskPath
cases:
  - id: has-bodies
    args: {}
    expect: { ok: true }
