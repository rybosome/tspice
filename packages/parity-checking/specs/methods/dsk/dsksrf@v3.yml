schemaVersion: 3
manifest:
  id: methods/dsk/dsksrf@v3
  kind: method
contract:
  contractMethod: dsk.dsksrf
  canonicalMethod: dsk.dsksrf
  args: []
  result:
    type: object
    required:
      - hasSurfaceIds
    properties:
      hasSurfaceIds:
        const: true
workflow:
  steps:
    - op: withResource
      as: dskPath
      acquire:
        op: materialize
        fixture: minimalDsk
        as: dskPath
      steps:
        - op: withResource
          as: dasHandle
          acquire:
            op: dasOpen
            path: $refs.dskPath
            as: dasHandle
          steps:
            - op: withResource
              as: dladsc
              acquire:
                op: dlaBeginForwardSearch
                handle: $refs.dasHandle
                as: dladsc
              steps:
                - op: spiceCall
                  call: dskgd_c
                  in:
                    - $refs.dasHandle
                    - $refs.dladsc
                  as: dskdsc
                - op: project
                  out:
                    bodyId: $refs.dskdsc.center
                - op: withResource
                  as: surfaceIds
                  acquire:
                    op: allocCell
                    as: surfaceIds
                    params:
                      kind: int
                      size: 100
                  steps:
                    - op: spiceCall
                      call: dsksrf_c
                      in:
                        - $refs.dskPath
                        - $refs.bodyId
                        - $refs.surfaceIds
                    - op: spiceCall
                      call: card_c
                      in:
                        - $refs.surfaceIds
                      as: surfaceCount
                    - op: assert
                      test:
                        gt:
                          - $refs.surfaceCount
                          - 0
                      error:
                        code: assert_dsksrf_has_surface_ids
                        message: dsksrf expected at least one surface id
                    - op: projectResult
                      out:
                        hasSurfaceIds: true
                  finally:
                    - op: freeCell
                      target: $refs.surfaceIds
              finally: []
          finally:
            - op: dasClose
              target: $refs.dasHandle
      finally:
        - op: unlink
          target: $refs.dskPath
cases:
  - id: has-surface-ids
    args: {}
    expect:
      ok: true
