schemaVersion: 2
manifest:
  id: methods/dsk/dsksrf@v2
  kind: method
contract:
  contractMethod: dsk.dsksrf
  canonicalMethod: dsk.dsksrf
  args: []
  result:
    type: object
    required: [hasSurfaceIds]
    properties:
      hasSurfaceIds: { const: true }
workflow:
  steps:
    - op: materialize
      fixture: minimalDsk
      as: dskPath
    - op: dasOpen
      path: $refs.dskPath
      as: dasHandle
    - op: dlaBeginForwardSearch
      handle: $refs.dasHandle
      as: dladsc
    - op: spiceCall
      call: dskgd_c
      in: [$refs.dasHandle, $refs.dladsc]
      as: dskdsc
    - op: project
      out:
        bodyId: $refs.dskdsc.center
    - op: allocCell
      as: surfaceIds
      params:
        kind: int
        size: 100
    - op: spiceCall
      call: dsksrf_c
      in: [$refs.dskPath, $refs.bodyId, $refs.surfaceIds]
    - op: spiceCall
      call: card_c
      in: [$refs.surfaceIds]
      as: surfaceCount
    - op: assert
      test:
        gt: [$refs.surfaceCount, 0]
      error:
        code: assert_dsksrf_has_surface_ids
        message: dsksrf expected at least one surface id
    - op: projectResult
      out:
        hasSurfaceIds: true
  cleanup:
    - op: freeCell
      target: $refs.surfaceIds
    - op: dasClose
      target: $refs.dasHandle
    - op: unlink
      target: $refs.dskPath
cases:
  - id: has-surface-ids
    args: {}
    expect: { ok: true }
