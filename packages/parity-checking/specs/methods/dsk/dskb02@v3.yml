schemaVersion: 3
manifest:
  id: methods/dsk/dskb02@v3
  kind: method
contract:
  contractMethod: dsk.dskb02
  canonicalMethod: dsk.dskb02
  args:
    - name: selector
      type: spiceInt
      constraints:
        min: 0
        max: 1
  result:
    type: object
    required:
      - selector
      - value
    properties:
      selector:
        type: spiceInt
      value:
        type: spiceInt
workflow:
  steps:
    - op: withResource
      as: dskPath
      acquire:
        op: materialize
        fixture: minimalDsk
        as: dskPath
      steps:
        - op: withResource
          as: dasHandle
          acquire:
            op: dasOpen
            path: $refs.dskPath
            as: dasHandle
          steps:
            - op: withResource
              as: dladsc
              acquire:
                op: dlaBeginForwardSearch
                handle: $refs.dasHandle
                as: dladsc
              steps:
                - op: call
                  in:
                    - $refs.dasHandle
                    - $refs.dladsc
                  out:
                    nv: nv
                    np: np
                  call: self
                - op: switch
                  on: $args.selector
                  cases:
                    "0":
                      - op: projectResult
                        out:
                          selector: $args.selector
                          value: $refs.nv
                    "1":
                      - op: projectResult
                        out:
                          selector: $args.selector
                          value: $refs.np
              finally: []
          finally:
            - op: dasClose
              target: $refs.dasHandle
      finally:
        - op: unlink
          target: $refs.dskPath
cases:
  - id: selector-nv
    args:
      selector: 0
    expect:
      ok: true
  - id: selector-np
    args:
      selector: 1
    expect:
      ok: true
