schemaVersion: 3
manifest:
  id: methods/frames/pxform@v3
  kind: method
contract:
  contractMethod: frames.pxform
  canonicalMethod: frames.pxform
setup:
  kernels:
    - $FIXTURES/frames-minimal
defaults:
  compare:
    tolAbs: 1e-12
    tolRel: 1e-12
workflow:
  steps:
    - op: call
      fn: frames.pxform
      in:
        - $args.0
        - $args.1
        - $args.2
cases:
  - id: pxform-identity
    args:
      - J2000
      - J2000
      - 1234.5
    expect:
      ok: true
  - id: pxform-j2000-b1950
    args:
      - J2000
      - B1950
      - 0
    expect:
      ok: true
  - id: pxform-unknown
    args:
      - J2000
      - NO_SUCH_FRAME
      - 0
    compare:
      errorShort: true
    expect:
      ok: false
