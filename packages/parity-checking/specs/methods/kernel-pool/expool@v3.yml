schemaVersion: 3
manifest:
  id: methods/kernel-pool/expool@v3
  kind: method
contract:
  contractMethod: kernel-pool.expool
  canonicalMethod: kernel-pool.expool
setup:
  kernels:
    - $FIXTURES/kernel-pool-parity.tpc
workflow:
  steps:
    - op: call
      call: self
      in:
        - $args.0
cases:
  - id: expool-char-miss
    args:
      - TSPICE_PARITY_CHAR_VAR
    expect:
      ok: true
  - id: expool-found
    args:
      - TSPICE_PARITY_DOUBLE_VAR
    expect:
      ok: true
  - id: expool-missing
    args:
      - TSPICE_PARITY_MISSING_VAR
    expect:
      ok: true
