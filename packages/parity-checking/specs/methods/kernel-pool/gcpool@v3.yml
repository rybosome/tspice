schemaVersion: 3
manifest:
  id: methods/kernel-pool/gcpool@v3
  kind: method
contract:
  contractMethod: kernel-pool.gcpool
  canonicalMethod: kernel-pool.gcpool
setup:
  kernels:
    - $FIXTURES/kernel-pool-parity.tpc
workflow:
  steps:
    - op: call
      fn: kernel-pool.gcpool
      in:
        - $args.0
        - $args.1
        - $args.2
cases:
  - id: gcpool-char-var
    args:
      - TSPICE_PARITY_CHAR_VAR
      - 0
      - 8
    expect:
      ok: true
  - id: gcpool-missing
    args:
      - TSPICE_PARITY_MISSING_VAR
      - 0
      - 8
    expect:
      ok: true
  - id: gcpool-type-mismatch
    args:
      - TSPICE_PARITY_DOUBLE_VAR
      - 0
      - 8
    compare:
      errorShort: true
