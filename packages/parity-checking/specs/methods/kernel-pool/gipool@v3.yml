schemaVersion: 3
manifest:
  id: methods/kernel-pool/gipool@v3
  kind: method
contract:
  contractMethod: kernel-pool.gipool
  canonicalMethod: kernel-pool.gipool
setup:
  kernels:
    - $FIXTURES/kernel-pool-parity.tpc
workflow:
  steps:
    - op: call
      fn: kernel-pool.gipool
      in: $args
cases:
  - id: gipool-int-var
    args:
      - TSPICE_PARITY_INT_VAR
      - 0
      - 8
    expect:
      ok: true
  - id: gipool-missing
    args:
      - TSPICE_PARITY_MISSING_VAR
      - 0
      - 8
    expect:
      ok: true
  - id: gipool-non-integer
    args:
      - TSPICE_PARITY_DOUBLE_VAR
      - 0
      - 8
    compare:
      errorShort: true
