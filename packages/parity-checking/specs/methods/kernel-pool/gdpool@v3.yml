schemaVersion: 3
manifest:
  id: methods/kernel-pool/gdpool@v3
  kind: method
contract:
  contractMethod: kernel-pool.gdpool
  canonicalMethod: kernel-pool.gdpool
setup:
  kernels:
    - $FIXTURES/kernel-pool-parity.tpc
workflow:
  steps:
    - op: call
      call: self
      in:
        - $args.0
        - $args.1
        - $args.2
cases:
  - id: gdpool-double-var
    args:
      - TSPICE_PARITY_DOUBLE_VAR
      - 0
      - 8
    expect:
      ok: true
  - id: gdpool-missing
    args:
      - TSPICE_PARITY_MISSING_VAR
      - 0
      - 8
    expect:
      ok: true
  - id: gdpool-type-mismatch
    args:
      - TSPICE_PARITY_CHAR_VAR
      - 0
      - 8
    expect:
      ok: true
