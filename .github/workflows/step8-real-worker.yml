name: Step 8 source recovery bundle
on:
  push:
    branches: [codex/step8-e24-worker-check]
permissions:
  contents: write
jobs:
  preserve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preserve both source revisions and their new ancestors
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = codex/step8-e24-worker-check
          git fetch origin '682964075f61626fc060c21b7ea36642d43dca0a:refs/heads/step8-transfer-b08' '47910886b43d07eb7cb1d0bf1803f2d4653b20c8:refs/heads/step8-transfer-e24'
          mkdir -p .step8-transfer
          git bundle create "$RUNNER_TEMP/step8-new-source.bundle" refs/heads/step8-transfer-b08 refs/heads/step8-transfer-e24 '^83bd6ca1cc3f68757025d30100fc508767276c89' '^996e837a228c49fa00c9c245d3a62cb6372d449c'
          git bundle verify "$RUNNER_TEMP/step8-new-source.bundle"
          shasum -a 256 "$RUNNER_TEMP/step8-new-source.bundle" | cut -d' ' -f1 > .step8-transfer/source.bundle.sha256
          base64 "$RUNNER_TEMP/step8-new-source.bundle" | split -d -a 3 -l 8000 - .step8-transfer/source.bundle.b64.
          git add -- .step8-transfer
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Preserve the exact B08 and E24 Git objects'
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
