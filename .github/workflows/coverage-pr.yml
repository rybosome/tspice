name: Coverage (PR)

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm + Node
        uses: ./.github/actions/setup-pnpm-node
        with:
          node-version: '22'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run all-unit coverage lane
        run: pnpm coverage

      - name: Aggregate coverage report
        run: pnpm coverage:report

      - name: Build sticky comment body
        run: |
          {
            echo "<!-- coverage-pr-summary -->"
            cat coverage/coverage-report.md
          } > coverage/coverage-comment.md

      - name: Upload coverage summary artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-pr-${{ github.event.pull_request.number }}
          retention-days: 7
          if-no-files-found: error
          path: |
            coverage/coverage-report.json
            coverage/coverage-report.md
            coverage/coverage-comment.md
            apps/*/coverage/coverage-summary.json
            fixtures/*/coverage/coverage-summary.json
            packages/*/coverage/coverage-summary.json
