name: Coverage (PR)

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  coverage:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm + Node
        uses: ./.github/actions/setup-pnpm-node
        with:
          node-version: '22'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run JS-only coverage lane
        run: pnpm coverage:js

      - name: Aggregate coverage report
        run: pnpm coverage:report

      - name: Build sticky comment body
        run: |
          {
            echo "<!-- coverage-pr-summary -->"
            cat coverage/coverage-report.md
          } > coverage/coverage-comment.md

      - name: Find existing coverage comment
        if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        id: find_coverage_comment
        continue-on-error: true
        uses: peter-evans/find-comment@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: github-actions[bot]
          body-includes: "<!-- coverage-pr-summary -->"

      - name: Create or update coverage comment
        if: ${{ github.event.pull_request.head.repo.full_name == github.repository && steps.find_coverage_comment.outcome == 'success' }}
        uses: peter-evans/create-or-update-comment@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ github.event.pull_request.number }}
          comment-id: ${{ steps.find_coverage_comment.outputs.comment-id }}
          edit-mode: replace
          body-path: coverage/coverage-comment.md

      - name: Upload coverage summary artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-pr-${{ github.event.pull_request.number }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            coverage/coverage-report.json
            coverage/coverage-report.md
            packages/*/coverage/coverage-summary.json
